<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Laporan Keuangan Multi-Usaha</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>
    <header>
        <h1>Laporan Keuangan Usaha</h1>
        <nav>
            <button onclick="switchTab('dashboard')">Dashboard</button>
            <button onclick="switchTab('pemasukan')">Pemasukan</button>
            <button onclick="switchTab('pengeluaran')">Pengeluaran</button>
            <button onclick="switchTab('hutang')">Hutang & Jatuh Tempo</button>
        </nav>
    </header>

    <main>
        <!-- Tab Dashboard -->
        <section id="dashboard-tab" class="tab-content active">
            <h2>Dashboard Ringkasan</h2>
            <div class="kategori-selector">
                <label for="filter-usaha">Pilih Unit Usaha:</label>
                <select id="filter-usaha" onchange="renderDashboard()">
                    <option value="semua">Semua Usaha</option>
                    <option value="taxi">Taxi Online</option>
                    <option value="service">Service Laptop</option>
                    <option value="spx">Driver SPX Express</option>
                    <option value="pribadi">Pengeluaran Pribadi / Dapur</option>
                </select>
            </div>
            <div id="ringkasan-kas"></div>
        </section>

        <!-- Tab Pemasukan -->
        <section id="pemasukan-tab" class="tab-content">
            <h2>Input Pemasukan</h2>
            <form id="form-pemasukan" onsubmit="tambahPemasukan(event)">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="in-tgl-masuk" required>
                </div>
                <div class="form-group">
                    <label>Unit Usaha</label>
                    <select id="in-unit-masuk" required>
                        <option value="taxi">Taxi Online</option>
                        <option value="service">Service Laptop</option>
                        <option value="spx">Driver SPX Express</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keterangan</label>
                    <input type="text" id="in-ket-masuk" placeholder="Contoh: Pendapatan harian / Service unit HP" required>
                </div>
                <div class="form-group">
                    <label>Jumlah (Rp)</label>
                    <input type="number" id="in-jumlah-masuk" required>
                </div>
                <button type="submit" class="btn-simpan">Simpan Pemasukan</button>
            </form>
        </section>

        <!-- Tab Pengeluaran -->
        <section id="pengeluaran-tab" class="tab-content">
            <h2>Input Pengeluaran</h2>
            <form id="form-pengeluaran" onsubmit="tambahPengeluaran(event)">
                <div class="form-group">
                    <label>Tanggal</label>
                    <input type="date" id="out-tgl" required>
                </div>
                <div class="form-group">
                    <label>Kategori & Unit Usaha</label>
                    <select id="out-unit" required>
                        <optgroup label="Bulanan / Operasional Usaha">
                            <option value="service">Gaji Karyawan Service Laptop</option>
                            <option value="spx">Gaji Rider SPX</option>
                            <option value="taxi">BBM / Servis Mobil Taxi Online</option>
                        </optgroup>
                        <optgroup label="Harian Usaha">
                            <option value="service">Belanja Sparepart Laptop</option>
                            <option value="semua">ATK & Operasional Kantor</option>
                            <option value="semua">Makanan Karyawan</option>
                        </optgroup>
                        <optgroup label="Pribadi / Rumah Tangga">
                            <option value="pribadi">Uang Dapur Istri</option>
                        </optgroup>
                    </select>
                </div>
                <div class="form-group">
                    <label>Keterangan Detail</label>
                    <input type="text" id="out-ket" placeholder="Contoh: Beli RAM DDR4 / Makan siang rider" required>
                </div>
                <div class="form-group">
                    <label>Jumlah (Rp)</label>
                    <input type="number" id="out-jumlah" required>
                </div>
                <button type="submit" class="btn-simpan">Simpan Pengeluaran</button>
            </form>
        </section>

        <!-- Tab Hutang -->
        <section id="hutang-tab" class="tab-content">
            <h2>Pencatatan Hutang & Jatuh Tempo</h2>
            <p>Fitur pencatatan utang, bunga, dan kalkulasi jatuh tempo akan aktif di tahap selanjutnya.</p>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
